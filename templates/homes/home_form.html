{% extends 'base.html' %}
{% block title %}{% if home %}Edit Home{% else %}New Home{% endif %} | Smart Power{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>{% if home %}Edit Home{% else %}Add Home{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <label>Name</label>
        <input type="text" name="name" value="{{ home.name|default:'' }}" required>
        <label>Description</label>
        <textarea name="description">{{ home.description|default:'' }}</textarea>
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
