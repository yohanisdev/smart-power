{% extends 'base.html' %}
{% block title %}Delete Home | Smart Power{% endblock %}
{% block content %}
<div class="card" style="max-width: 480px; margin: 2rem auto;">
    <h2>Delete home</h2>
    <p>Are you sure you want to delete <strong>{{ home.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete</button>
        <a href="{% url 'home_list' %}">Cancel</a>
    </form>
</div>
{% endblock %}
