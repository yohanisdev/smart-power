{% extends 'base.html' %}
{% block title %}{% if appliance %}Edit Appliance{% else %}Add Appliance{% endif %} | Smart Power{% endblock %}
{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <h2>{% if appliance %}Edit Appliance{% else %}Add Appliance{% endif %}</h2>
    <form method="post">
        {% csrf_token %}
        <label>Home</label>
        <select name="home">
            {% for item in homes %}
                <option value="{{ item.id }}" {% if appliance and appliance.home.id == item.id %}selected{% elif home and home.id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
        <label>Name</label>
        <input type="text" name="name" value="{{ appliance.name|default:'' }}" required>
        <label>Category</label>
        <select name="category">
            {% for value, label in appliance.CATEGORY_CHOICES %}
                <option value="{{ value }}" {% if appliance and appliance.category == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
        </select>
        <label>Power (Watts)</label>
        <input type="number" step="0.01" name="power_watts" value="{{ appliance.power_watts|default:0 }}">
        <label>Average Hours per Day</label>
        <input type="number" step="0.01" name="average_hours_per_day" value="{{ appliance.average_hours_per_day|default:0 }}">
        <label>Days per Period</label>
        <input type="number" step="0.01" name="days_per_period" value="{{ appliance.days_per_period|default:30 }}">
        <label>Quantity</label>
        <input type="number" min="1" name="quantity" value="{{ appliance.quantity|default:1 }}">
        <label>Standby Power (Watts)</label>
        <input type="number" step="0.01" name="standby_power_watts" value="{{ appliance.standby_power_watts|default:0 }}">
        <label><input type="checkbox" name="is_active" {% if appliance and appliance.is_active %}checked{% elif not appliance %}checked{% endif %}> Active</label>
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
