{% extends 'base.html' %}
{% block title %}{% if reading %}Edit Reading{% else %}Add Reading{% endif %} | Smart Power{% endblock %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2>{% if reading %}Edit Meter Reading{% else %}Add Meter Reading{% endif %}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Home</label>
        <select name="home">
            {% for item in homes %}
                <option value="{{ item.id }}" {% if reading and reading.home.id == item.id %}selected{% elif home and home.id == item.id %}selected{% endif %}>{{ item.name }}</option>
            {% endfor %}
        </select>
        <label>Reading (kWh)</label>
        <input type="number" step="0.001" name="reading_value_kwh" value="{{ reading.reading_value_kwh|default:0 }}" required>
        <label>Date</label>
        <input type="date" name="reading_date" value="{{ reading.reading_date|default:'' }}" required>
        <label>Source</label>
        <select name="source">
            <option value="manual" {% if reading and reading.source == 'manual' %}selected{% endif %}>Manual</option>
            <option value="csv_import" {% if reading and reading.source == 'csv_import' %}selected{% endif %}>CSV Import</option>
            <option value="smart_meter" {% if reading and reading.source == 'smart_meter' %}selected{% endif %}>Smart Meter</option>
            <option value="authorized_utility_api" {% if reading and reading.source == 'authorized_utility_api' %}selected{% endif %}>Authorized Utility API</option>
        </select>
        <label>Notes</label>
        <textarea name="notes">{{ reading.notes|default:'' }}</textarea>
        <label>CSV Upload</label>
        <input type="file" name="csv_file" accept=".csv">
        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
